name: Prepare full INCLUDE model

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-model:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install model tooling
        run: python -m pip install --upgrade pip && python -m pip install torch numpy

      - name: Download and prepare full INCLUDE Transformer
        run: python scripts/prepare-model.py

      - name: Commit model artifact
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add model-source/augs_transformer.pth public/model/include-transformer-full.bin public/model/include-transformer-full.json
          git diff --cached --quiet || git commit -m 'Add full AI4Bharat INCLUDE Transformer artifacts'
          git push
